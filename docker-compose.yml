# OTP Secure - one command start for the jury (Linux):
#
#   docker compose up -d --build
#
# No .env is needed: every setting, including the demo secrets, is below.
# Host networking: the API sees the REAL source address of each TCP connection
# (127.0.0.1 vs 127.0.0.2) - no NAT, no proxy, X-Forwarded-For is ignored.
# OTP "SMS" are appended to ./outbox/sms.jsonl on the host.
name: otp-secure

x-otp-settings: &otp-settings
  APP_ENV: development
  DEBUG: "false"
  HOST: 127.0.0.1
  PORT: "${API_PORT:-8000}"
  REDIS_URL: redis://127.0.0.1:${REDIS_PORT:-6390}/0
  REDIS_KEY_PREFIX: otp
  # demo secrets for the hackathon stand only - replace them for any real deployment
  OTP_HMAC_KEY: inai2026-demo-hmac-key-9f4c2a7e1b8d6053c4a1e7f2b9d8c6a5
  ADMIN_API_KEY: inai2026-demo-admin-key-3e8b5d1f7a2c9064
  # all intervals are REAL seconds (values from the task)
  OTP_TTL: "120"
  OTP_LENGTH: "6"
  SEND_WINDOW_SECONDS: "600"
  MAX_SEND_PER_WINDOW: "3"
  SEND_COOLDOWN_1: "30"
  SEND_COOLDOWN_2: "60"
  SEND_COOLDOWN_3: "120"
  MAX_VERIFY_ATTEMPTS: "5"
  PHONE_BLOCK_SECONDS: "900"
  IP_VERIFY_LIMIT: "20"
  IP_VERIFY_WINDOW: "60"
  OUTBOX_ENABLED: "true"
  OUTBOX_PATH: outbox/sms.jsonl
  DEMO_MODE: "true"
  TRUST_PROXY_HEADERS: "false"

services:
  redis:
    image: redis:7-alpine
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "${REDIS_PORT:-6390}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT:-6390}", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    network_mode: host
    environment: *otp-settings
    volumes:
      - ./outbox:/app/outbox
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
