<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>OTP Secure — вход администратора</title>
  <link rel="preload" href="/static/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/boot.js"></script>
</head>
<body>
  <div class="page-glow" aria-hidden="true"><div class="glow"></div></div>
  <header class="header" id="header">
    <div class="header-inner">
      <a class="brand" href="/demo" aria-label="OTP Secure — на главную">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2.75 4.75 5.5v5.6c0 4.6 3.05 8.6 7.25 10.15 4.2-1.55 7.25-5.55 7.25-10.15V5.5L12 2.75Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="m8.75 12.25 2.25 2.25 4.25-4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>OTP Secure</span>
      </a>
      <nav class="nav" aria-label="Основная навигация"><a href="/demo">Demo</a><a href="/docs">API</a></nav>
    </div>
  </header>
  <main class="center-stage">
    <section class="card card-enter" aria-labelledby="login-title">
      <div class="card-top"><span class="card-tag">POST /admin/login</span></div>
      <h1 class="title" id="login-title">Security Dashboard</h1>
      <p class="sub">Введите <code>ADMIN_API_KEY</code> из окружения сервера. Ключ обменивается на сессию и не сохраняется в браузере.</p>
      <form id="login-form" novalidate>
        <div class="field">
          <label class="label" for="admin-key">Ключ администратора</label>
          <input class="input" id="admin-key" type="password" autocomplete="current-password" spellcheck="false" required>
        </div>
        <div class="banner-slot" id="login-banner" aria-live="polite"></div>
        <button class="btn btn-primary" id="login-btn" type="submit">
          <span class="btn-label">Войти</span>
          <span class="btn-spinner" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".3" stroke-width="2.5"/><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></span>
        </button>
      </form>
    </section>
  </main>
  <script src="/static/js/admin.js"></script>
</body>
</html>
