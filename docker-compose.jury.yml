# Linux jury mode in Docker: host networking, so the API sees the REAL source address
# of each TCP connection (127.0.0.1 vs 127.0.0.2) - no NAT, no proxy.
#   docker compose -f docker-compose.jury.yml up --build
# Works on Linux hosts (network_mode: host is not equivalent on Docker Desktop).
name: otp-secure-jury

services:
  redis:
    image: redis:7-alpine
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "${REDIS_PORT:-6379}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT:-6379}", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    network_mode: host
    user: "${OTP_UID:-1000}:${OTP_GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://127.0.0.1:${REDIS_PORT:-6379}/0
      HOST: 127.0.0.1
      PORT: "${PORT:-8000}"
      TRUST_PROXY_HEADERS: "false"
    volumes:
      - ./outbox:/app/outbox
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
